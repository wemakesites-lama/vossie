<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Vossie sign-in code</title>
  </head>
  <body style="margin: 0; padding: 24px 16px; background: #ffffff; color: #373f41; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5">
    <!-- Vossie's sign-in code (backend spec section 5). Plain on purpose: no images, no tracking pixel, no links. -->
    <main style="max-width: 480px; margin: 0 auto">
      <h1 style="margin: 0 0 16px; color: #15305d; font-size: 22px; line-height: 1.3">Your Vossie sign-in code</h1>
      <p style="margin: 0 0 8px">Type this 6-digit code on the sign-in page:</p>
      <p style="margin: 0 0 16px; color: #15305d; font-size: 36px; font-weight: bold; letter-spacing: 6px; font-family: 'Courier New', Courier, monospace">{{ .Token }}</p>
      <p style="margin: 0 0 16px">It lasts 10 minutes.</p>
      <p style="margin: 0; color: #5b6577">If you didn't ask for this, you can ignore this email.</p>
    </main>
  </body>
</html>
